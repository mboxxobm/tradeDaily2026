name: Deploy tradeDaily2026 to GitHub Pages

on:
  push:
    branches:
      - main
    # 足データだけの自動コミットではサイト全体を再デプロイしない。
    # ほかのファイルも含まれるコミットでは、これまでどおりデプロイする。
    paths-ignore:
      - "market_data/dukascopy/**"
      - ".github/workflows/dukascopy_candles.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
